<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cleo</title>
<meta name="description" content="Cleo lets members of regulated professions record their continuing professional development and keep it as verifiable credentials.">
<style>
  :root { --bg: #ffffff; --fg: #1a1d1d; --muted: #5a6060; --link: #0b5c8a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121414; --fg: #eef0f0; --muted: #a3aaaa; --link: #7cc4ee; }
  }
  html { background: var(--bg); color: var(--fg); }
  body {
    margin: 0 auto;
    max-width: 36rem;
    padding: 4rem 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
  }
  h1 { font-size: 2.5rem; line-height: 1.2; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  a { color: var(--link); }
  footer { margin-top: 3rem; color: var(--muted); font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Cleo</h1>
  <p>Cleo lets members of regulated professions record their continuing professional development and keep it as verifiable credentials.</p>
  <p>Contact: <a href="mailto:sales@cleo.id">sales@cleo.id</a></p>
</main>
<footer>
  <p>Guardian Labs Pty Ltd</p>
</footer>
</body>
</html>
